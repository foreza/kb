function checkIsACuriousFraction(numA,numB) {

    // 2nd number should always be bigger than first

        return false;
    }

    // cast to string

    let curiousDivison = parseInt(numAstr[0]) / parseInt(numBstr[1]);
    console.log(`curiousDivison: ${numAstr[0]} / ${numBstr[1]} = ${curiousDivison}`)

    if (numA/numB != curiousDivison) {
        return false;
    }

    console.log(`We found a curious fraction: ${numAstr} / ${numBstr}`)
    return true;
}

checkIsACuriousFraction(49,98); // true
